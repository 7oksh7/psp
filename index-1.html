<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSP Player</title>
<style>
:root{--bg:#f4f4f6;--fg:#1a1a1f;--card:#fff;--ac:#3b5bdb}
@media(prefers-color-scheme:dark){:root{--bg:#121216;--fg:#eee;--card:#1d1d24;--ac:#7c93ff}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#menu{display:flex;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center}
.card{background:var(--card);padding:24px;border-radius:16px;max-width:420px;width:100%}
button,label.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;display:inline-block}
input[type=file]{display:none}
#name{opacity:.7;font-size:14px}#err{color:#d33;font-size:14px}
#game{width:100%;height:100%;display:none}
#log{position:fixed;left:0;right:0;bottom:0;max-height:30%;overflow:auto;background:#000c;color:#9f9;font:11px monospace;padding:6px;margin:0;z-index:99999;white-space:pre-wrap}
</style></head><body>
<div id="menu"><div class="card">
<h2>PSP Player</h2>
<p>Pick a game from your tablet (.iso .cso .pbp). It never leaves your device.</p>
<label class="btn" for="f">Choose game</label>
<input id="f" type="file">
<p id="name"></p><button id="go" style="display:none">Start</button>
<p id="err"></p></div></div>
<div id="game"></div>
<pre id="log">log:
</pre>
<script>
const $=id=>document.getElementById(id);let file;
const L=m=>{$('log').textContent+=m+'\n';$('log').scrollTop=1e9};
window.addEventListener('error',e=>L('ERR '+e.message));
window.addEventListener('unhandledrejection',e=>L('REJ '+(e.reason&&e.reason.message||e.reason)));
['warn','error'].forEach(k=>{const o=console[k];console[k]=(...a)=>{try{L(k+': '+a.join(' ').slice(0,200))}catch(_){}o.apply(console,a)}});
L('isolated='+window.crossOriginIsolated);
const _f=window.fetch;window.fetch=function(u,o){const n=(u&&u.url)||String(u);return _f.apply(this,arguments).then(r=>{L('fetch '+r.status+' '+n.split('/').slice(-2).join('/').slice(0,60));return r},e=>{L('fetch FAIL '+n.slice(-60)+' '+e.message);throw e})};
const _o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){const n=String(u);this.addEventListener('loadend',()=>L('xhr '+this.status+' '+n.split('/').slice(-2).join('/').slice(0,60)));return _o.apply(this,arguments)};
let tick=0;setInterval(()=>{if(!$('game').style.display||$('game').style.display==='none')return;tick+=3;L(tick+'s emu='+(typeof EmulatorJS)+' inst='+!!window.EJS_emulator+' kids='+$('game').children.length)},3000);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('coi-sw.js').then(()=>{
    if(!window.crossOriginIsolated && !sessionStorage.r){sessionStorage.r=1;location.reload()}
  }).catch(e=>$('err').textContent='Service worker failed: '+e.message);
}else $('err').textContent='This page must be served over https.';
$('f').onchange=e=>{file=e.target.files[0];if(!file)return;$('name').textContent=file.name;$('go').style.display='inline-block'};
$('go').onclick=()=>{
  if(!file)return;
  if(/\.(7z|zip|rar)$/i.test(file.name)){$('err').textContent='Extract the archive first and pick the .iso/.cso/.pbp inside.';return}
  if(!window.crossOriginIsolated){$('err').textContent='Not ready yet. Reload the page once and try again.';return}
  $('menu').style.display='none';$('game').style.display='block';
  window.EJS_player='#game';window.EJS_core='psp';
  window.EJS_gameName=file.name.replace(/\.[^.]+$/,'');
  window.EJS_gameUrl=URL.createObjectURL(file)+'#'+encodeURIComponent(file.name);L('file: '+file.name+' '+file.size+' bytes');
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_threads=true;window.EJS_startOnLoaded=true;
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onload=()=>L('loader ready');s.onerror=()=>L('loader FAILED to load');document.body.appendChild(s);
};
</script></body></html>
